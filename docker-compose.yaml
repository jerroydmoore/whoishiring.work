services:
  populate-hn-data:
    build: ./populate-hn-data
    depends_on: 
      - "provision-db"
    environment:
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_USER_PASSWORD}
      - PGHOST=postgres
      - PGDATABASE
      - PGPORT
      - HOWMANY_STORIES=2
      - DEBUG

  postgres:
    image: postgres:12
    environment:
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD}
    ports:
      - "5432:5432"

  provision-db:
    build: ./provision-db
    depends_on: 
      - "postgres"
    environment:
      - PGUSER=${DB_ADMIN}
      - PGPASSWORD=${DB_ADMIN_PASSWORD}
      - DB_USER
      - DB_USER_PASSWORD
      - PGHOST
      - PGDATABASE
      - PGPORT

  backend:
    build:
      context: ./backend
      target: develop
    depends_on: 
      - "populate-hn-data"
    environment: 
      - DB_USER
      - DB_USER_PASSWORD
      - PGHOST
      - PGDATABASE
      - PGPORT
    ports:
      - "8080:8080"
      - "9229:9229" # inspect debugging port
    command: './wait-for-it.sh $PGHOST:$PGPORT -- node --inspect ./src/server.js'
    volumes:
      - "./backend/src:/src"

  frontend:
    build:
      context: ./frontend
      dockerfile: development.Dockerfile
    depends_on: 
      - "backend"
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules/
    command: gatsby develop -H 0.0.0.0 -p 8000
